services:
  - type: web
    name: fivem-medical-training-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: medical-portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
